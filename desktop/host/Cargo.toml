[package]
name = "vidsnap-host"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "vidsnap-host"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = 2
strip = true
