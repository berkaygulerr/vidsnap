[package]
name = "vidsnap-app"
version = "0.2.2"
edition = "2021"

[lib]
name = "vidsnap_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2"
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
strip = true

